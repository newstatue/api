services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  valkey:
    image: valkey/valkey:9.1
    ports:
      - "6379:6379"

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"
      - "9333:9333"