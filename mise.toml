[tools]
go = "1.27.3"

[env]
CGO_CFLAGS_ALLOW="-Xpreprocessor"
MACOSX_DEPLOYMENT_TARGET="27.0"

[tasks.dev]
description="启动 API 开发服务"
run="go run ."

[tasks.dev.env]
ENV="dev"
POSTGRES_URL="postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
VALKEY_URL="redis://localhost:6379/0"
SEAWEEDFS_URL="s3://my-bucket?endpoint=http%3A%2F%2Flocalhost%3A8333&region=us-east-1&use_path_style=true"
PORT="8080"
SESSION_SECURE="false"
SESSION_TTL="168h"